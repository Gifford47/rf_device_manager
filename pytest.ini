[pytest]
# Only the HA integration tests are pytest tests. tests/test_*.py are
# standalone scripts (run them with plain `python`).
testpaths = tests/integration
# Make `custom_components` importable from the repo root (plain `pytest`
# does not put the working directory on sys.path, `python -m pytest` does).
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
